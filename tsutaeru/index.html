<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="よみあげ">
  <title>よみあげ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17313c;
      --muted: #50636a;
      --line: #c8d5d9;
      --paper: #ffffff;
      --background: #f5f7f8;
      --blue: #17627b;
      --blue-dark: #0f4b60;
      --blue-soft: #e8f3f7;
      --red-soft: #fff1ed;
      --red: #a83a24;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 100%; height: 100%; }

    body {
      background: var(--background);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 4px solid #f2a44b; outline-offset: 2px; }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 600px;
      max-width: 1600px;
      margin: auto;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow: hidden;
    }

    .message-panel {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 16px;
      min-height: 128px;
      flex: 1 1 150px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 165px;
      overflow: hidden;
    }

    .message-display {
      padding: 16px 19px;
      font-size: clamp(36px, 4.5vw, 58px);
      font-weight: 750;
      line-height: 1.4;
      overflow-wrap: anywhere;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      white-space: pre-wrap;
    }

    .message-display.long { font-size: clamp(29px, 3.4vw, 42px); }
    .message-display.empty { color: #74868c; font-weight: 600; }

    .message-actions {
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 2px solid var(--line);
      background: #fbfcfc;
    }

    .message-actions button {
      flex: 1;
      min-height: 48px;
      border-radius: 11px;
      border: 2px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
    }

    .message-actions .show-button { background: var(--paper); color: var(--blue-dark); }
    .message-actions button:active { transform: scale(.98); }

    .phrases { flex: 0 0 auto; min-height: 0; }
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 6px;
    }

    .category-tab {
      height: 42px;
      padding: 0 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--paper);
      color: var(--ink);
      font-size: 17px;
      font-weight: 750;
      white-space: nowrap;
    }

    .category-tab[aria-selected="true"] { background: var(--blue); color: white; border-color: var(--blue); }

    .phrase-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

    .phrase-button {
      min-width: 0;
      min-height: 49px;
      padding: 5px 8px;
      border: 1.5px solid #b9cdd4;
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      font-size: clamp(16px, 1.95vw, 21px);
      font-weight: 750;
      line-height: 1.2;
    }

    .phrase-button.urgent { border-color: #e3a798; background: var(--red-soft); color: #842c1d; }
    .phrase-button:active { background: var(--blue-soft); }

    .keyboard { flex: 0 0 auto; min-height: 0; }
    .keyboard-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
    }

    .keyboard-head span { color: var(--muted); }
    .keyboard-tools { display: flex; align-items: center; gap: 8px; }
    .layout-modes { display: flex; gap: 5px; }
    .layout-mode {
      min-height: 42px;
      padding: 3px 10px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }
    .layout-mode[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: white; }
    .speak-letters, .voice-button, .qr-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 3px 10px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .speak-letters[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
    .speak-letters .switch-mark { font-size: 20px; line-height: 1; color: var(--blue); }
    .voice-button { min-width: 110px; font-size: 17px; }
    .qr-button { min-width: 55px; font-size: 18px; }

    .qr-panel {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: #17313ca8;
    }
    .qr-panel[hidden] { display: none; }
    .qr-card { width: min(100%, 590px); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px; border-radius: 16px; background: var(--paper); }
    .qr-card h2 { margin: 0; font-size: 28px; }
    .qr-card p { margin: 0; color: var(--muted); font-size: 18px; text-align: center; }
    .qr-card img { display: block; width: min(100%, 480px, 58vh); height: auto; image-rendering: pixelated; }
    .qr-close { width: 100%; min-height: 60px; border: 2px solid var(--blue); border-radius: 10px; background: var(--blue); color: white; font-size: 23px; font-weight: 800; }

    .voice-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: #17313ca8;
    }

    .voice-panel[hidden] { display: none; }
    .voice-card { width: min(100%, 570px); max-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 16px; background: var(--paper); }
    .voice-card h2 { margin: 0; font-size: 26px; }
    .voice-help { margin: 0; color: var(--muted); font-size: 18px; }
    .voice-list { display: grid; gap: 8px; overflow-y: auto; }
    .voice-choice, .voice-close { min-height: 58px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 21px; font-weight: 750; }
    .voice-choice[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
    .voice-close { align-self: stretch; background: var(--blue); border-color: var(--blue); color: white; }

    .keys { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }

    .key {
      min-width: 0;
      height: clamp(58px, 8vh, 82px);
      padding: 0 2px;
      border: 1.5px solid #b5c8cf;
      border-bottom-width: 3px;
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      font-size: clamp(25px, 3.2vw, 35px);
      font-weight: 750;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
    }

    .key:active { background: var(--blue-soft); border-bottom-width: 1.5px; }
    .key.blank { visibility: hidden; pointer-events: none; }
    .key.action { background: #e9eff2; font-size: clamp(15px, 1.9vw, 20px); }
    .key.action.choose-next { background: var(--blue-soft); color: var(--blue-dark); }
    .key.backspace { background: #dfeaf0; }
    .key.clear { background: #f7e8e3; color: #852c1b; border-color: #e2b7aa; }
    .key.return { grid-column: span 3; background: var(--blue-soft); color: var(--blue-dark); font-size: 23px; }

    .app.kana-only .message-panel { flex: 0 0 clamp(150px, 23vh, 240px); }
    .app.kana-only .keyboard { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .app.kana-only .keys { flex: 1 1 auto; min-height: 0; grid-template-rows: repeat(6, minmax(0, 1fr)); }
    .app.kana-only .key { height: 100%; font-size: clamp(30px, 3.7vw, 42px); }
    .app.kana-only .key.action { font-size: clamp(15px, 2vw, 22px); }
    .app.kana-only .key.return { font-size: 23px; }

    .app.flick-mode .keys { width: min(100%, 100vh); width: min(100%, 100dvh); align-self: center; grid-template-columns: minmax(0, 3fr) minmax(0, 2.5fr); grid-template-rows: minmax(0, 1fr); }
    .app.flick-mode .flick-kana-grid { min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .app.flick-mode .flick-action-grid { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .app.flick-mode .key.action { font-size: clamp(14px, 2.5vw, 26px); white-space: nowrap; }
    .app.flick-mode .key.action.choose-next { font-size: clamp(12px, 2vw, 21px); }
    .app.flick-mode .key.return { grid-column: auto; font-size: clamp(16px, 2vw, 22px); }
    .flick-key { position: relative; touch-action: none; }
    .flick-key .flick-choice { color: var(--ink); font-size: clamp(34px, 4vw, 54px); font-weight: 800; pointer-events: none; }
    .flick-popup { --bubble: clamp(70px, 9vw, 96px); position: fixed; z-index: 60; width: calc(var(--bubble) * 3 + 16px); height: calc(var(--bubble) * 3 + 16px); pointer-events: none; }
    .flick-popup[hidden], .flick-popup-choice[hidden] { display: none; }
    .flick-popup-choice { position: absolute; display: flex; align-items: center; justify-content: center; width: var(--bubble); height: var(--bubble); border: 1.5px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 5px 14px #17313c55; color: var(--ink); font-size: clamp(39px, 5vw, 52px); font-weight: 800; }
    .flick-popup-choice.selected { background: var(--blue); color: white; }
    .flick-popup-choice.center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .flick-popup-choice.left { top: 50%; left: 0; transform: translateY(-50%); }
    .flick-popup-choice.up { top: 0; left: 50%; transform: translateX(-50%); }
    .flick-popup-choice.right { top: 50%; right: 0; transform: translateY(-50%); }
    .flick-popup-choice.down { bottom: 0; left: 50%; transform: translateX(-50%); }

    .status { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

    .full-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #fff;
      padding: max(20px, env(safe-area-inset-top)) max(25px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(25px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .full-screen[hidden] { display: none; }
    .full-screen-text { flex: 1; min-height: 0; display: flex; overflow-y: auto; }
    .full-screen-content { margin: auto; max-width: 100%; min-width: 0; text-align: center; font-size: 44px; font-weight: 800; line-height: 1.18; overflow-wrap: anywhere; white-space: pre-wrap; }
    .full-screen-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .full-screen-actions button { min-width: 160px; min-height: 60px; border: 2px solid var(--blue); border-radius: 12px; background: var(--paper); color: var(--blue-dark); font-size: 23px; font-weight: 800; }
    .full-screen-actions button:disabled { opacity: 0.45; }
    .full-screen-actions .read-again { background: var(--blue); color: white; }

    @media (max-width: 1000px) { .keyboard-head #keyboardHint { display: none; } }

    @media (max-width: 800px) {
      .keyboard-head #keyboardHint { display: none; }
      .message-panel { grid-template-columns: minmax(0, 1fr) 145px; }
      .message-actions button { font-size: 19px; }
      .category-tab { font-size: 15px; }
      .phrase-button { font-size: 17px; }
      .keys { gap: 4px; }
      .key.action { font-size: 15px; }
    }

    @media (max-width: 700px) {
      .keyboard-head #keyboardHint { display: none; }
      .layout-mode { font-size: 14px; padding-inline: 6px; }
      .keyboard-tools { gap: 5px; }
    }

    @media (max-height: 700px) {
      .app { gap: 6px; padding-top: 6px; padding-bottom: 6px; }
      .message-panel { min-height: 100px; }
      .category-tab { height: 37px; }
      .phrase-button { min-height: 44px; }
      .keyboard-head { min-height: 42px; }
      .key { height: clamp(46px, 8vh, 58px); }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="app" class="app kana-only">
    <section class="message-panel" aria-label="伝える言葉">
      <div id="message" class="message-display empty" aria-live="polite">ここに言葉が出ます</div>
      <div class="message-actions">
        <button id="readButton" type="button">読み上げ</button>
        <button id="showButton" class="show-button" type="button">大きく見せる</button>
      </div>
    </section>

    <section id="phrases" class="phrases" aria-label="よく使う言葉" hidden>
      <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="言葉の種類"></div>
      <div id="phraseGrid" class="phrase-grid" role="tabpanel" aria-label="選んだ種類の言葉"></div>
    </section>

    <section class="keyboard" aria-label="50音で入力">
      <div class="keyboard-head">
        <span id="keyboardHint">文字を押して文章を作る</span>
        <div class="keyboard-tools">
          <div class="layout-modes" role="group" aria-label="画面の表示">
            <button id="phrasesMode" class="layout-mode" type="button" aria-pressed="false">文例あり</button>
            <button id="kanaMode" class="layout-mode" type="button" aria-pressed="true">50音を大きく</button>
            <button id="flickMode" class="layout-mode" type="button" aria-pressed="false">フリック</button>
          </div>
          <button id="voiceButton" class="voice-button" type="button">声を選ぶ</button>
          <button id="qrButton" class="qr-button" type="button" aria-label="このアプリのQRコードを表示">QR</button>
          <button id="letterMode" class="speak-letters" type="button" aria-pressed="true"><span class="switch-mark" aria-hidden="true">☑</span>文字も読む：入</button>
        </div>
      </div>
      <div id="keys" class="keys"></div>
    </section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <section id="fullScreen" class="full-screen" aria-label="大きく見せる画面" hidden>
    <div id="fullScreenText" class="full-screen-text"><span id="fullScreenContent" class="full-screen-content"></span></div>
    <div class="full-screen-actions">
      <button id="closeFullScreen" type="button">もどる</button>
      <button id="smallerText" type="button" aria-label="文字を小さくする">− 小さく</button>
      <button id="largerText" type="button" aria-label="文字を大きくする">＋ 大きく</button>
      <button id="readAgain" class="read-again" type="button">読み上げ</button>
    </div>
  </section>

  <section id="qrPanel" class="qr-panel" role="dialog" aria-modal="true" aria-labelledby="qrTitle" hidden>
    <div class="qr-card">
      <h2 id="qrTitle">よみあげを開く</h2>

    ];

    const columns = [
      ['あ', 'い', 'う', 'え', 'お'],
      ['か', 'き', 'く', 'け', 'こ'],
      ['さ', 'し', 'す', 'せ', 'そ'],
      ['た', 'ち', 'つ', 'て', 'と'],

    const fullScreen = document.getElementById('fullScreen');

    let pendingMark = null;
    let keyboardMode = 'kana';
    let fullScreenFontSize = 112;
    try { selectedVoiceURI = localStorage.getItem('tsutaeru-voice') || ''; } catch (_) {}
    try {
      const savedSize = Number(localStorage.getItem('tsutaeru-display-size'));
      if (savedSize >= 48 && savedSize <= 272) fullScreenFontSize = savedSize;
    } catch (_) {}

    function setStatus(text) { statusElement.textContent = text; }

    function updateMessage() {
      messageElement.textContent = message || 'ここに言葉が出ます';
      messageElement.classList.toggle('empty', !message);
      messageElement.classList.toggle('long', message.length > 28);
      fullScreenContent.textContent = message;
      messageElement.scrollTop = messageElement.scrollHeight;
    }

    function applyFullScreenFontSize() {
      const contentStyle = fullScreenContent.style;
      const availableWidth = fullScreenText.clientWidth - 8;
      const availableHeight = fullScreenText.clientHeight - 8;
      contentStyle.whiteSpace = 'nowrap';
      contentStyle.maxWidth = 'none';
      contentStyle.flexShrink = '0';
      contentStyle.fontSize = `${fullScreenFontSize}px`;
      const oneLineWidth = fullScreenContent.getBoundingClientRect().width;
      const oneLineSize = Math.min(fullScreenFontSize, Math.floor(fullScreenFontSize * availableWidth / Math.max(1, oneLineWidth)));
      contentStyle.maxWidth = '';
      contentStyle.flexShrink = '';
      const minimumOneLineSize = Math.min(fullScreenFontSize, Math.max(80, fullScreenFontSize - 24));
      if (oneLineSize >= minimumOneLineSize) {
        contentStyle.fontSize = `${oneLineSize}px`;
      } else {
        contentStyle.whiteSpace = 'pre-wrap';
        let low = 48;
        let high = fullScreenFontSize;
        let best = 48;
        while (low <= high) {
          const size = Math.floor((low + high) / 2);
          contentStyle.fontSize = `${size}px`;
          if (fullScreenContent.getBoundingClientRect().height <= availableHeight) {
            best = size;
            low = size + 1;
          } else {
            high = size - 1;
          }
        }
        contentStyle.fontSize = `${best}px`;
      }
      fullScreenText.scrollTop = 0;
      smallerTextButton.disabled = fullScreenFontSize <= 48;
      largerTextButton.disabled = fullScreenFontSize >= 272;
    }

    function adjustFullScreenFontSize(change) {
      const previousSize = fullScreenContent.style.fontSize;
      const previousWrapping = fullScreenContent.style.whiteSpace;
      do {
        fullScreenFontSize = Math.max(48, Math.min(272, fullScreenFontSize + change));
        applyFullScreenFontSize();
      } while (fullScreenFontSize > 48 && fullScreenFontSize < 272 &&
               fullScreenContent.style.fontSize === previousSize &&
               fullScreenContent.style.whiteSpace === previousWrapping);
      try { localStorage.setItem('tsutaeru-display-size', String(fullScreenFontSize)); } catch (_) {}
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentUtterance = null;
    }

    function speak(text) {
      if (!text) { setStatus('文字を選んでください'); return; }
      if (!('speechSynthesis' in window)) {
        setStatus('このiPadでは読み上げが使えません。画面の文字を見せてください');
        return;
      }
      stopSpeaking();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1;
      utterance.volume = 1;
      const selectedVoice = window.speechSynthesis.getVoices().find(voice => voice.voiceURI === selectedVoiceURI && voice.lang.toLowerCase().startsWith('ja'));
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.onstart = () => setStatus('読み上げています');
      utterance.onend = () => { currentUtterance = null; setStatus('読み上げが終わりました'); };
      utterance.onerror = event => {
        currentUtterance = null;
        if (event.error !== 'canceled' && event.error !== 'interrupted') setStatus('読み上げできませんでした。画面の文字を見せてください');
      };
      currentUtterance = utterance;
      window.speechSynthesis.speak(utterance);
    }

    function renderVoices() {
      voiceList.replaceChildren();
      const voices = 'speechSynthesis' in window
        ? window.speechSynthesis.getVoices().filter(voice => voice.lang.toLowerCase().startsWith('ja'))
        : [];
      const nameCounts = new Map();
      voices.forEach(voice => nameCounts.set(voice.name, (nameCounts.get(voice.name) || 0) + 1));
      const nameOrder = new Map();
      const choices = [{ name: '標準の声', voiceURI: '' }, ...voices];
      choices.forEach(voice => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'voice-choice';
        const order = (nameOrder.get(voice.name) || 0) + 1;
        nameOrder.set(voice.name, order);
        button.textContent = (nameCounts.get(voice.name) || 0) > 1 ? `${voice.name} ${order}` : voice.name;
        button.setAttribute('aria-pressed', String(selectedVoiceURI === voice.voiceURI));
        button.addEventListener('click', () => {
          selectedVoiceURI = voice.voiceURI;
          voiceSampleTried = true;
          try { localStorage.setItem('tsutaeru-voice', selectedVoiceURI); } catch (_) {}
          renderVoices();
          speak('こんにちは。よろしくお願いします。');
        });
        voiceList.append(button);
      });
      if (!voices.length) {
        const note = document.createElement('p');
        note.className = 'voice-help';
        note.textContent = voiceSampleTried
          ? 'ほかの日本語の声は、このiPadでは見つかりません。'
          : 'ほかの声が出ないときは、まず「標準の声」を押してください。';
        voiceList.append(note);
      }
    }

    function addLetter(letter) {
      message += letter;
      updateMessage();
      if (readLetters) speak(letter);
    }

    function convertLastLetter(action) {
      const last = message.slice(-1);
      let converted = candidateGroups[action].map[last];
      if (!converted) {
        const from = action === 'voiced' ? 'ぱぴぷぺぽ' : 'ばびぶべぼ';
        const to = action === 'voiced' ? 'ばびぶべぼ' : 'ぱぴぷぺぽ';
        const index = [...from].indexOf(last);
        if (index >= 0) converted = [...to][index];
      }
      if (!converted) return false;
      message = message.slice(0, -1) + converted;
      pendingMark = { action, original: last };
      updateMessage();
      if (readLetters) speak(converted);
      renderKeyboard();
      return true;
    }

    function renderCategories() {
      const container = document.getElementById('categoryTabs');
      container.replaceChildren();
      categories.forEach((category, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'category-tab';
        button.textContent = category.label;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(index === currentCategory));
        button.addEventListener('click', () => {
          currentCategory = index;
          renderCategories();
          renderPhrases();
        });
        container.append(button);
      });
    }

    function renderPhrases() {
      const container = document.getElementById('phraseGrid');
      container.replaceChildren();
      categories[currentCategory].phrases.forEach(phrase => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'phrase-button';
        if (['苦しいです', '息が苦しいです', '痰が出せません', 'すぐ来てください', '看護師さんを呼んでください'].includes(phrase)) button.classList.add('urgent');
        button.textContent = phrase;
        button.addEventListener('click', () => {
          if (pendingMark) { pendingMark = null; renderKeyboard(); }
          message = phrase;
          updateMessage();
          speak(phrase);
        });
        container.append(button);
      });
    }

    const flickPopup = document.createElement('div');
    flickPopup.className = 'flick-popup';
    flickPopup.hidden = true;
    flickPopup.setAttribute('aria-hidden', 'true');
    const flickPositions = ['center', 'left', 'up', 'right', 'down'];
    const popupChoices = flickPositions.map(position => {
      const choice = document.createElement('span');
      choice.className = 'flick-popup-choice ' + position;
      flickPopup.append(choice);
      return choice;
    });
    document.body.append(flickPopup);

    function showFlickPopup(button, choices, selectedIndex) {
      popupChoices.forEach((choice, index) => {
        choice.textContent = choices[index];
        choice.hidden = !choices[index];
        choice.classList.toggle('selected', index === selectedIndex);
      });
      flickPopup.hidden = false;
      const keyRect = button.getBoundingClientRect();
      const popupRect = flickPopup.getBoundingClientRect();
      const left = keyRect.left + keyRect.width / 2 - popupRect.width / 2;
      const top = keyRect.top + keyRect.height / 2 - popupRect.height / 2;
      flickPopup.style.left = Math.max(8, Math.min(left, window.innerWidth - popupRect.width - 8)) + 'px';
      flickPopup.style.top = Math.max(8, Math.min(top, window.innerHeight - popupRect.height - 8)) + 'px';
    }

    function renderFlickKeys(container, chooseLetter) {
      const directionLabels = ['タップ', '左', '上', '右', '下'];
      columns.forEach((column, columnIndex) => {
        if (candidateMode && columnIndex === 8) {
          const back = document.createElement('button');
          back.type = 'button';
          back.className = 'key return';
          back.textContent = 'フリックにもどる';
          back.addEventListener('click', () => { candidateMode = null; renderKeyboard(); });
          container.append(back);
          return;
        }
        const choices = column.map(letter => candidateMode ? candidateGroups[candidateMode].map[letter] || '' : letter);
        if (candidateMode === 'small' && column[0] === 'た') {
          choices[0] = choices[2];
          choices[2] = '';
        }
        if (!choices.some(Boolean)) {
          const blank = document.createElement('span');
          blank.className = 'key blank';
          blank.setAttribute('aria-hidden', 'true');
          container.append(blank);
          return;
        }
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'key flick-key';
        button.setAttribute('aria-label', column[0] + '行。' + choices.map((letter, index) => letter ? directionLabels[index] + 'で' + letter : '').filter(Boolean).join('、'));
        const center = document.createElement('span');
        center.className = 'flick-choice';
        center.textContent = choices[0];
        button.append(center);
        let pointerId = null;
        let startX = 0;
        let startY = 0;
        let lastPointerUp = 0;
        const showChoice = index => popupChoices.forEach((choice, choiceIndex) => {
          choice.classList.toggle('selected', choiceIndex === index);
        });
        const direction = event => {
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          const threshold = Math.max(25, Math.min(button.clientWidth, button.clientHeight) * 0.18);
          if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return 0;
          return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 1 : 3) : (dy < 0 ? 2 : 4);
        };
        button.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          pointerId = event.pointerId;
          startX = event.clientX;
          startY = event.clientY;
          button.setPointerCapture(pointerId);
          showFlickPopup(button, choices, 0);
        });
        button.addEventListener('pointermove', event => {
          if (event.pointerId === pointerId) showChoice(direction(event));
        });
        button.addEventListener('pointerup', event => {
          if (event.pointerId !== pointerId) return;
          const letter = choices[direction(event)];
          pointerId = null;
          lastPointerUp = Date.now();
          flickPopup.hidden = true;
          if (button.hasPointerCapture(event.pointerId)) button.releasePointerCapture(event.pointerId);
          if (letter) chooseLetter(letter);
        });
        button.addEventListener('pointercancel', () => { pointerId = null; flickPopup.hidden = true; });
        button.addEventListener('click', () => {
          if (Date.now() - lastPointerUp >= 400 && choices[0]) chooseLetter(choices[0]);
        });
        container.append(button);
      });
    }

    function renderKeyboard() {
      const container = document.getElementById('keys');
      flickPopup.hidden = true;
      container.replaceChildren();
      document.getElementById('keyboardHint').textContent = candidateMode
        ? candidateGroups[candidateMode].label : keyboardMode === 'flick' ? '指を上下左右に動かして文字を選ぶ' : '文字を押して文章を作る';
      const chooseLetter = letter => {
        if (candidateMode || pendingMark) {
          candidateMode = null;
          pendingMark = null;
          renderKeyboard();
        }
        addLetter(letter);
      };
      let actionContainer = container;
      if (keyboardMode === 'flick') {
        const kanaGrid = document.createElement('div');
        kanaGrid.className = 'flick-kana-grid';
        actionContainer = document.createElement('div');
        actionContainer.className = 'flick-action-grid';
        container.append(kanaGrid, actionContainer);
        renderFlickKeys(kanaGrid, chooseLetter);
      } else for (let row = 0; row < 5; row++) {
        for (let columnIndex = 0; columnIndex < columns.length; columnIndex++) {
          if (candidateMode && row === 1 && columnIndex === 7) {
            const back = document.createElement('button');
            back.type = 'button';
            back.className = 'key return';
            back.textContent = '50音にもどる';
            back.addEventListener('click', () => { candidateMode = null; renderKeyboard(); });
            container.append(back);
            columnIndex += 2;
            continue;
          }
          const column = columns[columnIndex];
          const letter = candidateMode ? candidateGroups[candidateMode].map[column[row]] || '' : column[row];
          const button = document.createElement(letter ? 'button' : 'span');
          if (letter) button.type = 'button';
          button.className = letter ? 'key' : 'key blank';
          button.textContent = letter;
          if (!letter) button.setAttribute('aria-hidden', 'true');
          else button.addEventListener('click', () => chooseLetter(letter));
          container.append(button);
        }
      }
      const actions = [
        ['゛', 'voiced'], ['゜', 'semi'], ['小文字', 'small'], ['ー', 'ー'], ['、', '、'],
        ['。', '。'], ['？', '？'], ['空白', ' '], ['一字消す', 'backspace'], ['全部消す', 'clear']
      ];
      actions.forEach(([label, action]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'key action';
        if (action === 'backspace') button.classList.add('backspace');
        if (action === 'clear') button.classList.add('clear');
        if (pendingMark && pendingMark.action === action) button.classList.add('choose-next');
        button.textContent = pendingMark && pendingMark.action === action ? label + 'を選ぶ' : label;
        button.addEventListener('click', () => {
          if (candidateGroups[action]) {
            if (pendingMark && pendingMark.action === action && !candidateMode) {
              message = message.slice(0, -1) + pendingMark.original;
              pendingMark = null;
              updateMessage();
              candidateMode = action;
              renderKeyboard();
              return;
            }
            pendingMark = null;
            if (!candidateMode && action !== 'small' && convertLastLetter(action)) return;
            candidateMode = action;
            renderKeyboard();
          } else if (action === 'backspace') {
            message = message.slice(0, -1); updateMessage();
          } else if (action === 'clear') {
            if (!message) return;
            stopSpeaking(); message = ''; updateMessage();
          } else {
            if (candidateMode) { candidateMode = null; renderKeyboard(); }
            addLetter(action);
          }
          if (pendingMark && !candidateGroups[action]) { pendingMark = null; renderKeyboard(); }
        });
        actionContainer.append(button);
      });
    }

    function setKeyboardMode(mode) {
      keyboardMode = mode;
      appElement.classList.toggle('kana-only', mode !== 'phrases');
      appElement.classList.toggle('flick-mode', mode === 'flick');
      phrasesSection.hidden = mode !== 'phrases';
      phrasesModeButton.setAttribute('aria-pressed', String(mode === 'phrases'));
      kanaModeButton.setAttribute('aria-pressed', String(mode === 'kana'));
      flickModeButton.setAttribute('aria-pressed', String(mode === 'flick'));
      candidateMode = null;
      pendingMark = null;
      renderKeyboard();
    }

    document.getElementById('readButton').addEventListener('click', () => speak(message));
    document.getElementById('readAgain').addEventListener('click', () => speak(message));
    document.getElementById('qrButton').addEventListener('click', () => {
      qrPanel.hidden = false;
      document.getElementById('closeQR').focus();
    });
    document.getElementById('closeQR').addEventListener('click', () => {
      qrPanel.hidden = true;
      document.getElementById('qrButton').focus();
    });
    document.getElementById('voiceButton').addEventListener('click', () => {
      renderVoices();
      voicePanel.hidden = false;
      document.getElementById('closeVoicePanel').focus();
    });
    document.getElementById('closeVoicePanel').addEventListener('click', () => {
      stopSpeaking();
      voicePanel.hidden = true;
      document.getElementById('voiceButton').focus();
    });
    if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', () => { if (!voicePanel.hidden) renderVoices(); });
    document.getElementById('showButton').addEventListener('click', () => {
      if (!message) { setStatus('文字を選んでください'); return; }
      fullScreen.hidden = false;
      applyFullScreenFontSize();
      document.getElementById('closeFullScreen').focus();
    });
    document.getElementById('closeFullScreen').addEventListener('click', () => {
      fullScreen.hidden = true;
      document.getElementById('showButton').focus();
    });
    smallerTextButton.addEventListener('click', () => adjustFullScreenFontSize(-16));
    largerTextButton.addEventListener('click', () => adjustFullScreenFontSize(16));
    letterModeButton.addEventListener('click', () => {
      readLetters = !readLetters;
      letterModeButton.setAttribute('aria-pressed', String(readLetters));
      letterModeButton.innerHTML = '<span class="switch-mark" aria-hidden="true">' + (readLetters ? '☑' : '□') + '</span>文字も読む：' + (readLetters ? '入' : '切');
    });
    phrasesModeButton.addEventListener('click', () => setKeyboardMode('phrases'));
    kanaModeButton.addEventListener('click', () => setKeyboardMode('kana'));
    flickModeButton.addEventListener('click', () => setKeyboardMode('flick'));
    window.addEventListener('resize', () => { if (!fullScreen.hidden) applyFullScreenFontSize(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeaking(); });

    renderCategories();
    renderPhrases();
    setKeyboardMode('kana');
    updateMessage();
  </script>
</body>
</html>
